name: Build plugin

# Macht aus einem hochgeladenen UVE-Player-Plugin EIN ZIP für Windows x64, Linux x86-64 und macOS ARM64.
#
# Start:  automatisch, sobald ein Windows-ZIP <Name>-<Version>.zip in den Zweig uve-player-plugins hochgeladen wird
#         (.github/workflows/plugin-zip-uploaded.yml dort), oder GitHub → Actions → "Build plugin" → "Run workflow".
# Quellen: sources/<Name>/ im Zweig uve-player-plugins (CMakeLists.txt mit add_library(<ziel> MODULE …)), gefunden
#         über den ZIP-Namen, den Plugin-Namen oder die ID. Einträge in .github/plugin-builds.json sind optional.
# Ablauf: Linux und macOS werden aus den Quellen gebaut, ihre Module (lib<name>.so / lib<name>.dylib) kommen neben
#         die Windows-DLL in genau dieses ZIP. "library" und minHostVersion bleiben (ältere Windows-Player laden
#         weiter die DLL), "libraries" wählt ab Player 1.2.9 das Modul je System. Das fertige ZIP ersetzt das
#         hochgeladene unter demselben Namen – außer es wurde während des Laufs im Zweig geändert.
# Prüfungen: Architektur jedes Moduls; Laden mit den Qt-Bibliotheken des veröffentlichten Players (IID, Schnittstelle,
#         eingebettete id/version); ID, Version und alle im Manifest genannten Dateien im fertigen ZIP.
on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "ZIP im Zweig uve-player-plugins, z. B. kickchat-1.3.2.zip"
        required: false
        default: ""
      plugin_id:
        description: "Optional statt zip_file: Plugin-ID (z. B. org.uveplayer.glsl-manager)"
        required: false
        default: ""
      version:
        description: "Optional statt zip_file: Version"
        required: false
        default: ""
      source_ref:
        description: "Optional: Tag, Zweig oder Commit der Quellen (nur für Plugins aus plugin-builds.json)"
        required: false
        default: ""
      player_ref:
        description: "Optional: Tag oder Commit des Players für Plugin-API und Qt (Standard: player.ref aus plugin-builds.json)"
        required: false
        default: ""
      publish:
        description: "Fertiges ZIP in den Zweig uve-player-plugins schreiben"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-plugin-${{ inputs.zip_file }}-${{ inputs.plugin_id }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.r.outputs.mode }}
      plugin_id: ${{ steps.r.outputs.plugin_id }}
      version: ${{ steps.r.outputs.version }}
      package: ${{ steps.r.outputs.package }}
      zip_name: ${{ steps.r.outputs.zip_name }}
      catalog_branch: ${{ steps.r.outputs.catalog_branch }}
      catalog_sha: ${{ steps.r.outputs.catalog_sha }}
      base_blob: ${{ steps.r.outputs.base_blob }}
      source_repo: ${{ steps.r.outputs.source_repo }}
      source_sha: ${{ steps.r.outputs.source_sha }}
      source_path: ${{ steps.r.outputs.source_path }}
      target: ${{ steps.r.outputs.target }}
      build_secrets: ${{ steps.r.outputs.build_secrets }}
      package_dir: ${{ steps.r.outputs.package_dir }}
      run_tests: ${{ steps.r.outputs.run_tests }}
      player_repo: ${{ steps.r.outputs.player_repo }}
      player_sha: ${{ steps.r.outputs.player_sha }}
      player_version: ${{ steps.r.outputs.player_version }}
      player_release: ${{ steps.r.outputs.player_release }}
      qt_version: ${{ steps.r.outputs.qt_version }}
      targets: ${{ steps.r.outputs.targets }}
      build_targets: ${{ steps.r.outputs.build_targets }}
      libraries: ${{ steps.r.outputs.libraries }}
      matrix: ${{ steps.r.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: r
        name: Resolve package, sources and player
        env:
          SOURCE_TOKEN: ${{ secrets.PLUGIN_SOURCES_TOKEN }}
        run: >
          python3 -I .github/scripts/plugin_build.py resolve
          --zip-file "${{ inputs.zip_file }}" --id "${{ inputs.plugin_id }}" --version "${{ inputs.version }}"
          --source-ref "${{ inputs.source_ref }}" --player-ref "${{ inputs.player_ref }}"
      - name: Summary
        run: |
          {
            echo "### ${{ steps.r.outputs.zip_name }} – ${{ steps.r.outputs.plugin_id }} ${{ steps.r.outputs.version }}"
            echo "| | |"
            echo "|---|---|"
            echo "| Modus | **${{ steps.r.outputs.mode }}** – gebaut: ${{ steps.r.outputs.build_targets }} |"
            echo "| Quellen | \`${{ steps.r.outputs.source_path }}\` (${{ steps.r.outputs.source_ref }} → \`${{ steps.r.outputs.source_sha }}\`), Ziel \`${{ steps.r.outputs.target }}\` |"
            echo "| Player | ${{ steps.r.outputs.player_ref }} → \`${{ steps.r.outputs.player_sha }}\`, Qt ${{ steps.r.outputs.qt_version }} |"
            echo "| Module | \`${{ steps.r.outputs.libraries }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    strategy:
      fail-fast: false   # jede Plattform meldet ihr Ergebnis; das Paket entsteht nur, wenn alle gelingen
      # windows-2022 / ubuntu-24.04 / macos-latest (Apple Silicon) wie im Player; beim Einfügen ohne Windows
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      QT_VERSION: ${{ needs.resolve.outputs.qt_version }}
      SRC: plugin/${{ needs.resolve.outputs.source_path }}
      TARGET: ${{ needs.resolve.outputs.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out files unchanged (no CRLF on Windows)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          path: ci
      - name: Checkout plugin sources
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.PLUGIN_SOURCES_TOKEN || github.token }}
          sparse-checkout: ${{ needs.resolve.outputs.source_path }}
          path: plugin
      - name: Checkout player (plugin API)
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.player_repo }}
          ref: ${{ needs.resolve.outputs.player_sha }}
          sparse-checkout: |
            src/plugins
            scripts
          path: player
      - name: Set package version
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          if [ -f "$SRC/manifest.json" ]; then
            $py -I ci/.github/scripts/plugin_build.py set-version --manifest "$SRC/manifest.json" --version "${{ needs.resolve.outputs.version }}"
          fi

      # ---- Toolchain und Qt wie im Release-Workflow des Players
      - name: Cache Qt (Windows)
        if: runner.os == 'Windows'
        id: qtcache
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-${{ hashFiles('player/scripts/fetch-qt.py') }}
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ steps.qtcache.outputs.cache-hit }}" -ne "true") {
            New-Item -ItemType Directory -Force player/deps/tools | Out-Null
            Invoke-WebRequest "https://github.com/ip7z/7zip/releases/download/26.05/7zr.exe" -OutFile player/deps/tools/7zr.exe
            python -I player/scripts/fetch-qt.py $env:QT_VERSION C:/Qt
            if ($LASTEXITCODE) { throw "Qt download failed" }
          }
          "QT_ROOT_DIR=C:\Qt\$env:QT_VERSION\msvc2022_64" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\Qt\$env:QT_VERSION\msvc2022_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 file
      - name: Homebrew packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtimageformats qtshadertools
          cache: true
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtimageformats qtshadertools
          cache: true

      # Werte, die nicht in die öffentlichen Quellen gehören (uve-build.json → "secrets"): aus dem
      # GitHub-Secret PLUGIN_BUILD_SECRETS als Header, der jeder Übersetzungseinheit vorangestellt wird
      - name: Build secrets
        if: needs.resolve.outputs.build_secrets != ''
        env:
          PLUGIN_BUILD_SECRETS: ${{ secrets.PLUGIN_BUILD_SECRETS }}
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py -I ci/.github/scripts/plugin_build.py secrets-header --names "${{ needs.resolve.outputs.build_secrets }}" --out "$RUNNER_TEMP/uve_build_secrets.h"
          echo "SECRETS_HEADER=$RUNNER_TEMP/uve_build_secrets.h" >> "$GITHUB_ENV"

      # ---- Build: nur das Plugin-Modul. Der Pfad zur PluginApi.h geht über die üblichen Variablen
      # (UVE_PLAYER_DIR, UVE_PLAYER_SOURCE, HOST_PLUGIN_API_DIR) und zusätzlich direkt an den Compiler.
      - name: Configure
        run: |
          api="$PWD/player/src/plugins"
          common=(-DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DUVE_PLAYER_DIR="$PWD/player" -DUVE_PLAYER_SOURCE="$PWD/player"
                  -DHOST_PLUGIN_API_DIR="$api" -DUVE_TARGET_KEY=${{ matrix.key }} -DBUILD_TESTING=OFF)
          if [ "$RUNNER_OS" = "Windows" ]; then
            win=()
            [ -n "$SECRETS_HEADER" ] && win=(-DCMAKE_CXX_FLAGS_INIT="/FI\"$(cygpath -w "$SECRETS_HEADER")\"")
            cmake -S "$SRC" -B build -G "Visual Studio 17 2022" -A x64 "${common[@]}" "${win[@]}"
          else
            extra=()
            [ "$RUNNER_OS" = "macOS" ] && extra=(-DCMAKE_OSX_ARCHITECTURES=arm64)
            flags="-I$api"
            [ -n "$SECRETS_HEADER" ] && flags="$flags -include $SECRETS_HEADER"
            cmake -S "$SRC" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${common[@]}" "${extra[@]}" -DCMAKE_CXX_FLAGS="$flags"
          fi
      - name: Build
        run: |
          cmake --build build --config Release --parallel --target "$TARGET"
          if [ "${{ needs.resolve.outputs.mode }}" = "full" ]; then cmake --build build --config Release --parallel; fi
      - name: Tests
        if: needs.resolve.outputs.run_tests == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Locate module
        id: mod
        env:
          LIBRARIES: ${{ needs.resolve.outputs.libraries }}
          PKG_DIR: ${{ needs.resolve.outputs.package_dir }}
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          rel=$($py -I -c "import json,os;print(json.loads(os.environ['LIBRARIES'])['${{ matrix.key }}'])")
          mkdir -p stage
          if [ "${{ needs.resolve.outputs.mode }}" = "full" ]; then
            # Plugin legt seinen fertigen Ordner selbst an (packageDir), Modul unter dem Pfad aus "libraries"
            cp -R "build/$PKG_DIR/." stage/
            [ -f "stage/$rel" ] || { echo "::error::Build hat $rel nicht in build/$PKG_DIR erzeugt"; find stage -type f; exit 1; }
          else
            $py -I ci/.github/scripts/plugin_build.py locate --target "$TARGET" --key ${{ matrix.key }} --roots "build,plugin" | tee locate.txt
            built=$(sed -n 's/^path=//p' locate.txt)
            rel=$(basename "$rel")
            cp "$built" "stage/$rel"
          fi
          echo "module=$PWD/stage/$rel" >> "$GITHUB_OUTPUT"
      - name: Remove build rpath (macOS)
        if: runner.os == 'macOS'
        run: |
          # Der absolute Qt-Pfad des Runners gehört nicht ins Paket; im Player kommt Qt aus dem App-Bundle
          m="${{ steps.mod.outputs.module }}"
          for p in $(otool -l "$m" | awk '/cmd LC_RPATH/{getline; getline; print $2}'); do install_name_tool -delete_rpath "$p" "$m"; done
          install_name_tool -add_rpath @executable_path/../Frameworks "$m"
          codesign --force --sign - "$m"
          otool -l "$m" | grep -A2 LC_RPATH || echo "no LC_RPATH"
      - name: Check architecture
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py -I ci/.github/scripts/plugin_build.py arch --module "${{ steps.mod.outputs.module }}" --key ${{ matrix.key }}

      # ---- Laufzeitabhängigkeiten im Ziel-Player: Modul mit den Qt-Bibliotheken des veröffentlichten Players laden
      - name: Build load check
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S ci/.github/plugin-loadcheck -B loadcheck -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DUVE_PLAYER_DIR="$PWD/player"
          else
            cmake -S ci/.github/plugin-loadcheck -B loadcheck -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DUVE_PLAYER_DIR="$PWD/player"
          fi
          cmake --build loadcheck --config Release
      - name: Fetch player release
        id: player
        if: needs.resolve.outputs.player_release != ''
        env:
          TAG: ${{ needs.resolve.outputs.player_release }}
          V: ${{ needs.resolve.outputs.player_version }}
        run: |
          base="https://github.com/${{ needs.resolve.outputs.player_repo }}/releases/download/$TAG"
          mkdir -p player-release && cd player-release
          case "$RUNNER_OS" in
            Windows) asset="UVE-Player-$V-portable.zip" ;;
            Linux)   asset="UVE-Player-$V-linux-x86_64.tar.gz" ;;
            macOS)   asset="UVE-Player-$V-macos-arm64.dmg" ;;
          esac
          if ! curl -fsSL --retry 3 -o "$asset" "$base/$asset"; then
            echo "::error::$asset aus dem Release $TAG nicht ladbar – ist der Player-Release fertig?"; exit 1
          fi
          case "$RUNNER_OS" in
            Windows) 7z x -y -oplayer "$asset" > /dev/null
                     exe=$(find player -name UVEPlayer.exe | head -1); echo "dir=$(dirname "$exe")" >> "$GITHUB_OUTPUT" ;;
            Linux)   mkdir player && tar -xzf "$asset" -C player
                     core=$(find player -name 'libQt6Core.so.6' | head -1); echo "dir=$(dirname "$core")" >> "$GITHUB_OUTPUT" ;;
            macOS)   hdiutil attach -nobrowse -readonly -mountpoint "$PWD/mnt" "$asset" > /dev/null
                     fw=$(find mnt -maxdepth 4 -type d -path '*.app/Contents/Frameworks' | head -1)
                     mkdir -p fw && cp -R "$fw/" fw/ && hdiutil detach mnt > /dev/null
                     echo "dir=$PWD/fw" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Load module with the player's Qt
        env:
          PLAYER_DIR: ${{ steps.player.outputs.dir }}
          MODULE: ${{ steps.mod.outputs.module }}
        run: |
          manifest=""
          [ -f "$SRC/manifest.json" ] && manifest="$PWD/$SRC/manifest.json"   # eingebettetes Manifest: id/version
          # Ausgabe der Ladeprüfung immer zeigen; bei einem Fehler zusätzlich als Annotation (Log braucht Anmeldung)
          check() {
            set +e
            out=$(QT_DEBUG_PLUGINS=1 "$@" 2>&1); rc=$?
            set -e
            echo "$out"
            if [ $rc -ne 0 ]; then
              msg=$(echo "$out" | grep -viE 'looking at|checking directory|loaded library|Trying\.\.\.' | tail -n 25 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')
              echo "::error title=Ladeprüfung ${{ matrix.key }} (exit $rc)::$msg"
              exit 1
            fi
          }
          if [ -z "$PLAYER_DIR" ]; then
            echo "::warning::Player-Ref ist kein Release-Tag – Ladeprüfung nur gegen das Qt des Runners"
          fi
          case "$RUNNER_OS" in
            Windows)
              dir="${PLAYER_DIR:-$QT_ROOT_DIR/bin}"
              cp loadcheck/Release/uve-plugin-loadcheck.exe "$dir/"   # neben den Qt-DLLs des Players
              check "$dir/uve-plugin-loadcheck.exe" "$MODULE" $manifest ;;
            Linux)
              export LD_LIBRARY_PATH="${PLAYER_DIR:-$QT_ROOT_DIR/lib}"
              ldd "$MODULE"
              if ldd "$MODULE" | grep -q "not found"; then echo "::error::Nicht auflösbare Abhängigkeiten: $(ldd "$MODULE" | grep 'not found' | tr '\n' ' ')"; exit 1; fi
              check ./loadcheck/uve-plugin-loadcheck "$MODULE" $manifest ;;
            macOS)
              lc=loadcheck/uve-plugin-loadcheck
              if [ -n "$PLAYER_DIR" ]; then
                for p in $(otool -l "$lc" | awk '/cmd LC_RPATH/{getline; getline; print $2}'); do install_name_tool -delete_rpath "$p" "$lc"; done
                install_name_tool -add_rpath "$PLAYER_DIR" "$lc"
                codesign --force --sign - "$lc"
              fi
              otool -L "$MODULE"
              bad=$(otool -L "$MODULE" | tail -n +2 | awk '{print $1}' | grep -vE '^(@rpath/Qt[A-Za-z]+\.framework/|/usr/lib/|/System/Library/)' || true)
              if [ -n "$bad" ]; then echo "::error::Abhängigkeiten außerhalb von Qt und System (im Player nicht vorhanden): $bad"; exit 1; fi
              check "$lc" "$MODULE" $manifest ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.key }}
          path: stage
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          pattern: module-*
          path: parts
      - name: Rename parts
        run: for d in parts/module-*; do mv "$d" "parts/${d#parts/module-}"; done; find parts -type f | sort
      - name: Fetch uploaded package
        if: needs.resolve.outputs.mode == 'insert'
        run: |
          git fetch -q --depth 1 origin "${{ needs.resolve.outputs.catalog_sha }}"
          git show "${{ needs.resolve.outputs.catalog_sha }}:${{ needs.resolve.outputs.zip_name }}" > base.zip
          ls -l base.zip
      - id: zip
        name: Assemble and verify package
        env:
          LIBRARIES: ${{ needs.resolve.outputs.libraries }}
        run: >
          python3 -I .github/scripts/plugin_build.py assemble --parts parts
          --id "${{ needs.resolve.outputs.plugin_id }}" --version "${{ needs.resolve.outputs.version }}"
          --package "${{ needs.resolve.outputs.package }}" --targets "${{ needs.resolve.outputs.targets }}"
          --built "${{ needs.resolve.outputs.build_targets }}" --zip-name "${{ needs.resolve.outputs.zip_name }}"
          --libraries "$LIBRARIES"
          ${{ needs.resolve.outputs.mode == 'insert' && '--base-zip base.zip' || '' }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error
          compression-level: 0   # das ZIP ist schon komprimiert
      - name: Summary
        run: |
          {
            echo "### ${{ steps.zip.outputs.file }}"
            echo "SHA-256 \`${{ steps.zip.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [resolve, package]
    if: ${{ !cancelled() && needs.package.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.catalog_branch }}
          sparse-checkout: |
            /*.zip
            /README.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: new
      - name: Replace package in ${{ needs.resolve.outputs.catalog_branch }}
        env:
          ZIP: ${{ needs.resolve.outputs.zip_name }}
          BASE_BLOB: ${{ needs.resolve.outputs.base_blob }}
          BRANCH: ${{ needs.resolve.outputs.catalog_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            # Nur ersetzen, was der Lauf als Grundlage genommen hat: ein neuerer Upload bleibt unberührt
            now=$(git rev-parse "HEAD:$ZIP" 2>/dev/null || true)
            if [ "$now" != "$BASE_BLOB" ]; then
              echo "::error::$ZIP wurde während des Laufs im Zweig geändert (vorher ${BASE_BLOB:-fehlt}, jetzt ${now:-fehlt}) – nichts überschrieben."
              exit 1
            fi
            cp "new/$ZIP" "$ZIP"
            git add "$ZIP"
            if git diff --cached --quiet; then echo "$ZIP unverändert"; exit 0; fi
            git commit -q -m "$ZIP: Windows, Linux und macOS" -m "Gebaut von ${{ github.workflow }} #${{ github.run_number }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), Modus ${{ needs.resolve.outputs.mode }}."
            if git push -q origin "HEAD:$BRANCH"; then
              echo "### $ZIP liegt jetzt in \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push abgelehnt (gleichzeitiger Upload) – neuer Versuch"; sleep 5
          done
          echo "::error::$ZIP konnte nicht nach $BRANCH geschrieben werden"; exit 1
