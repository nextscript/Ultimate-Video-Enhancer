name: Release

# Builds UVE Player for Windows, Linux and macOS and publishes the GitHub release
# "UVE Player <version>" (tag uve-player-v<version>, version taken from CMakeLists.txt).
#
# Runs ONLY on request – a normal push does not build or release anything:
#   • GitHub → Actions → "Release" → "Run workflow" (branch uve-player), or
#   • push a release tag:  git tag uve-player-v1.0.6 && git push origin uve-player-v1.0.6
on:
  workflow_dispatch:
  push:
    tags: ["uve-player-v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Manuell angestossene Laeufe werden nicht mehr automatisch abgebrochen - der macOS-Job
  # haengt oft laenger in der Runner-Warteschlange und wurde so bisher abgebrochen.
  # Tag-Pushs ueberholen aeltere Laeufe weiterhin (cancel-in-progress).
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  QT_VERSION: "6.12.0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(sed -n 's/^project(UVEPlayer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libmpv, yt-dlp, 7zr and NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mpv = Get-Content deps/mpv/version.json | ConvertFrom-Json
          Invoke-WebRequest "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$($mpv.version)/$($mpv.asset)" -OutFile mpv-dev.7z
          7z e -y mpv-dev.7z libmpv-2.dll -odeps/mpv | Out-Null
          if (-not (Test-Path deps/mpv/libmpv-2.dll)) { throw "libmpv-2.dll missing" }

          $yt = Get-Content deps/tools/yt-dlp/version.json | ConvertFrom-Json
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$($yt.version)"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile deps/tools/yt-dlp/yt-dlp.exe
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile yt-dlp-sums.txt
          $expected = ((Get-Content yt-dlp-sums.txt | Where-Object { $_ -match '\s\*?yt-dlp\.exe\s*$' }) -split '\s+')[0]
          if ((Get-FileHash deps/tools/yt-dlp/yt-dlp.exe).Hash -ne $expected) { throw "yt-dlp checksum mismatch" }

          Invoke-WebRequest "https://github.com/ip7z/7zip/releases/download/26.05/7zr.exe" -OutFile deps/tools/7zr.exe
          choco install nsis -y --no-progress

      # aqtinstall 3.3 does not understand the per-architecture repository layout Qt uses for Windows
      # since 6.12 -> fetch Qt with scripts/fetch-qt.py (official Qt repository, SHA-1 verified)
      - name: Cache Qt
        id: qtcache
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2022_64-${{ hashFiles('scripts/fetch-qt.py') }}

      - name: Install Qt
        shell: pwsh
        run: |
          if ("${{ steps.qtcache.outputs.cache-hit }}" -ne "true") { python -I scripts/fetch-qt.py $env:QT_VERSION C:/Qt }
          if ($LASTEXITCODE) { throw "Qt download failed" }
          "QT_ROOT_DIR=C:\Qt\$env:QT_VERSION\msvc2022_64" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package.ps1 -Generator "Visual Studio 17 2022" -SkipTests

      - name: Tests
        continue-on-error: true   # media playback tests need a GPU, which hosted runners do not have
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/UVE-Player-*-setup.exe
            release/UVE-Player-*-portable.exe
            release/UVE-Player-*-portable.zip

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv-dev ninja-build pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libfuse2 file

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtimageformats qtshadertools
          cache: true

      - name: Build and package
        run: bash scripts/package-linux.sh

      - name: Tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/UVE-Player-*.AppImage
            release/UVE-Player-*.tar.gz

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew packages
        run: brew install mpv ninja pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          # QtWebEngine gibt es fuer 6.12.0 GA als offizielles Extensions-Archiv fuer macOS –
          # damit hat der macOS-Build eingebettete Web-Ansichten (webview.available, Embed-Chat).
          modules: qtimageformats qtshadertools qtwebengine
          cache: true

      - name: Build and package
        run: bash scripts/package-macos.sh

      - name: Tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/UVE-Player-*.dmg

  release:
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum UVE-Player-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: uve-player-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: UVE Player ${{ needs.version.outputs.version }}
          body_path: CHANGELOG.md
          make_latest: false   # the repository also hosts UVE Manager releases
          overwrite_files: true   # a new run replaces the assets of the same version
          files: |
            dist/UVE-Player-*
            dist/SHA256SUMS.txt
