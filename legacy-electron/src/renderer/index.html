<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UVE Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="ui-root">
    <main id="stage">
      <video id="video" preload="auto" playsinline></video>
      <div id="empty" class="ui">
        <img src="assets/icon.png" alt="" width="96" height="96">
        <h1>UVE Player</h1>
        <p>Datei hierher ziehen oder öffnen</p>
        <div class="row">
          <button data-action="open-file" class="btn primary">Datei öffnen</button>
          <button data-action="open-folder" class="btn">Ordner</button>
          <button data-action="open-url" class="btn">Netzwerkstream</button>
        </div>
        <p class="hint" id="plugin-hint"></p>
      </div>
      <div id="audio-art" class="ui hidden"><div class="disc"></div><div id="audio-title"></div></div>
      <div id="osd" class="ui"></div>
      <div id="dropzone" class="ui hidden"><div>Zum Abspielen loslassen</div></div>
      <div id="busy" class="ui hidden">
        <div class="busy-card">
          <div id="busy-title">Bereite Datei vor…</div>
          <div class="bar"><div id="busy-bar"></div></div>
          <div id="busy-detail" class="muted"></div>
          <button id="busy-cancel" class="btn">Abbrechen</button>
        </div>
      </div>
    </main>

    <aside id="playlist" class="ui">
      <header>
        <strong>Wiedergabeliste</strong>
        <span id="pl-count" class="muted"></span>
      </header>
      <input id="pl-search" type="search" placeholder="Suchen…" spellcheck="false">
      <ol id="pl-list" tabindex="0"></ol>
      <footer>
        <button class="icon" data-action="pl-add" title="Hinzufügen">＋</button>
        <button class="icon" data-action="pl-remove" title="Ausgewählte entfernen (Entf)">－</button>
        <button class="icon" data-action="pl-clear" title="Liste leeren">✕</button>
        <button class="icon" data-action="pl-sort" title="Nach Name sortieren">⇅</button>
        <button class="icon" data-action="save-playlist" title="Speichern">⤓</button>
        <span class="grow"></span>
        <button class="icon toggle" id="btn-shuffle" data-action="toggle-shuffle" title="Zufall (Z)">⇄</button>
        <button class="icon toggle" id="btn-repeat" data-action="cycle-repeat" title="Wiederholen (R)">↻</button>
      </footer>
    </aside>

    <section id="controls" class="ui">
      <div id="seek" title="">
        <div id="seek-buffer"></div>
        <div id="seek-fill"></div>
        <div id="seek-ab"></div>
        <div id="seek-thumb"></div>
        <div id="seek-tip"></div>
      </div>
      <div class="bar-row">
        <button class="icon big" id="btn-play" data-action="toggle-play" title="Wiedergabe/Pause (Leertaste)">▶</button>
        <button class="icon" data-action="prev" title="Vorheriger (P)">⏮</button>
        <button class="icon" data-action="stop" title="Stopp (S)">⏹</button>
        <button class="icon" data-action="next" title="Nächster (N)">⏭</button>
        <span id="time" class="time">00:00 / 00:00</span>
        <span class="grow" id="now-playing"></span>
        <button class="pill" id="btn-speed" data-action="speed-menu" title="Geschwindigkeit ([ ] =)">1.00×</button>
        <button class="pill" data-action="sub-menu" title="Untertitel (V)">CC</button>
        <button class="pill" id="btn-fit" data-action="cycle-fit" title="Seitenverhältnis (A)">Einpassen</button>
        <button class="pill" data-action="equalizer" title="Equalizer (Strg+E)">EQ</button>
        <button class="pill accent" id="btn-uve" data-action="uve-menu" title="Ultimate Video Enhancer">UVE</button>
        <button class="icon" data-action="toggle-playlist" title="Wiedergabeliste (Strg+L)">☰</button>
        <button class="icon" data-action="fullscreen" title="Vollbild (F)">⛶</button>
        <button class="icon" id="btn-mute" data-action="mute" title="Stumm (M)">🔊</button>
        <input id="volume" type="range" min="0" max="200" step="1" value="100" title="Lautstärke (bis 200 %)">
        <span id="vol-label" class="time small">100 %</span>
      </div>
    </section>

    <div id="popup" class="ui hidden"></div>
    <dialog id="dialog" class="ui"><form method="dialog" id="dialog-form"></form></dialog>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
